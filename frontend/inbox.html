<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox — Social AI Filter</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/inbox.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand">Social AI <span>Filter</span></div><nav class="nav-list"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link active" href="inbox.html">Inbox</a><a class="nav-link" href="opportunities.html">Opportunities</a><a class="nav-link" href="content.html">Content</a><a class="nav-link" href="automation.html">Automation</a><a class="nav-link" href="smart-priorities.html">Smart Priorities</a><a class="nav-link" href="settings.html">Settings</a></nav><div class="sidebar-user"><div class="avatar">M</div><div><strong>Mosken</strong><small>Creator</small></div></div></aside><button class="sidebar-overlay" id="sidebarOverlay" aria-label="Close navigation"></button><main class="main-content"><header class="topbar"><button class="menu-button" id="menuButton" aria-label="Open navigation">☰</button><div><p class="topbar-label">COMMUNICATIONS</p><h1>Inbox</h1></div><div class="topbar-actions"><button class="icon-button" aria-label="Notifications">🔔</button><div class="avatar">M</div></div></header><section class="inbox-header"><div><h2>All messages</h2><p class="muted">Let AI surface the conversations that matter.</p></div><label class="search-box"><span>⌕</span><input id="messageSearch" type="search" placeholder="Search messages..." aria-label="Search messages"></label></section><section class="toolbar"><div class="filter-tabs" id="filterTabs"><button class="filter-tab active" data-filter="all">All</button><button class="filter-tab" data-filter="important">Important</button><button class="filter-tab" data-filter="relevant">Relevant</button><button class="filter-tab" data-filter="general">General</button><button class="filter-tab" data-filter="spam">Spam</button></div><div class="selects"><select id="platformFilter" aria-label="Filter by platform"><option value="all">All platforms</option><option value="TikTok">TikTok</option><option value="Instagram">Instagram</option><option value
