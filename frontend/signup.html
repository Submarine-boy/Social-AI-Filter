<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Social AI Filter</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">Social AI Filter</a>
      <h1>Create your account</h1>
      <p>Start organizing your important social conversations.</p>
      <form id="signup-form">
        <label>Full name<input type="text" name="name" required autocomplete="name"></label>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label>Confirm password<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label>
        <label class="check"><input type="checkbox" required> I agree to the terms and privacy policy</label>
        <button type="submit" class="primary-button">Create Account</button>
      </form>
      <p id="auth-message" aria-live="polite"></p>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
