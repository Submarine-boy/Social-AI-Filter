<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Social AI Filter</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">Social AI Filter</a>
      <h1>Welcome back</h1>
      <p>Sign in to manage the conversations that matter.</p>
      <form id="login-form">
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
        <div class="auth-row"><label class="check"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
        <button type="submit" class="primary-button">Login</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
